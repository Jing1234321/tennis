name: Refresh availability

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-availability.yml"
      - "server.js"
      - "scripts/update-availability.js"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out cache branch
        uses: actions/checkout@v4
        with:
          ref: availability-cache

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Refresh availability JSON
        run: node scripts/update-availability.js

      - name: Commit cache update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/availability.json
          if git diff --cached --quiet; then
            echo "No availability changes to commit."
          else
            git commit -m "Update availability cache"
            git push origin HEAD:availability-cache
          fi
