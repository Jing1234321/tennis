name: Keep Render awake

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/keep-render-awake.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping original Render URL
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 5 --max-time 45 \
            "https://tennis-783m.onrender.com/api/health?keepalive=$(date +%s)"
